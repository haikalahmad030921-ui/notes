</div>

<!-- BEGIN: BrandAndMascotHeader -->

<!-- Crisp White Container Card with Smooth Top Border Radius -->

<div>
<!-- Heading & Switcher Tabs -->
<div class="flex items-center justify-between mb-5">
<div>
<h2 class="text-xl font-bold text-slate-900 tracking-tight">Masuk Akun</h2>
<p class="text-xs text-slate-400 mt-0.5 font-medium">Lanjutkan progres belajar terbarumu</p>
</div>
<!-- Quick User Badge (James Preview from snapshot) -->
<div class="flex items-center space-x-1.5 py-1 px-2.5 rounded-full bg-slate-100/90 border border-slate-200">
<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
<span class="text-[11px] font-semibold text-slate-700">James</span>
</div>
</div>
<!-- Form Elements -->
<form class="space-y-3.5" id="login-form" onsubmit="event.preventDefault();">
<!-- Field: Username / Email -->
<div data-purpose="input-group-username">
<label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5 ml-1" for="username">

            </label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-slate-400">
<!-- User Icon -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>

</span>
<input class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-purple-500/30 focus:border-brand-purple-600 transition-all duration-200" id="username" name="name" placeholder="Contoh: James / nama kamu" required="" type="text" value="James"/>
</div>
</div>
<!-- Field: Kata Sandi / Password -->

</div>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-slate-400">

<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>

<svg class="w-5 h-5" fill="none" id="eye-icon" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>

<path d="M5.28 14.26c-.25-.72-.38-1.49-.38-2.26s.13-1.54.38-2.26V6.59H1.24C.45 8.16 0 9.98 0 12s.45 3.84 1.24 5.41l4.04-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.6 1.24 6.59l4.04 3.15c.95-2.84 3.6-4.99 6.72-4.99z" fill="#EA4335"></path>

<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.87c.66-.82 1.11-1.96.99-3.11-1 .04-2.19.67-2.89 1.49-.62.72-1.16 1.88-1.01 2.99 1.12.09 2.25-.55 2.91-1.37z"></path>

<p class="text-xs text-slate-500 font-medium">
          Belum punya akun GeoNotes?

          </a>
</p>

<div class="mt-4 flex justify-center">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</div>

<!-- BEGIN: InteractiveHandlers -->
<script data-purpose="password-toggle">
    const toggleBtn = document.getElementById('toggle-password-btn');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      toggleBtn.classList.toggle('text-brand-orange-500', isPassword);
    });
  </script>
<!-- END: InteractiveHandlers -->
